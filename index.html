<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>辦公室飲料訂購系統 🧋</title>
  
  <!-- Google Fonts: Inter & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  
  <!-- React 18, React DOM 18, Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Suppress in-browser Babel warning -->
  <script>
    (function() {
      const originalWarn = console.warn;
      console.warn = function(...args) {
        if (args[0] && typeof args[0] === 'string' && args[0].includes('You are using the in-browser Babel transformer')) {
          return;
        }
        originalWarn.apply(console, args);
      };
    })();
  </script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Custom Tailwind Config: Milky Tea & Matcha Theme -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            milktea: {
              50: '#FAF7F2',   // Creamy background
              100: '#F4EDE0',  // Warm cream
              200: '#E9DEC9',  // Light tea milk
              300: '#DABFA2',  // Brown sugar light
              405: '#C79E7B',
              500: '#AF825C',  // Primary caramel brown
              600: '#946A47',  // Medium dark caramel
              700: '#7A5436',  // Deep chocolate
              800: '#5F3E26',
              900: '#402614',
              950: '#251408',
            },
            matcha: {
              50: '#F5F7F2',
              100: '#E8EFE1',
              200: '#CFDEC0',
              300: '#AFC69B',
              400: '#8EAA75',
              505: '#6C8C52',  // Accent green
              600: '#54713E',
              700: '#40562F',
              800: '#2E3D21',
              900: '#1D2714',
            }
          },
          fontFamily: {
            sans: ['Inter', '"Noto Sans TC"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            'custom-sm': '0 2px 8px rgba(30, 41, 59, 0.03)',
            'custom': '0 10px 30px -10px rgba(30, 41, 59, 0.06)',
            'custom-lg': '0 20px 40px -15px rgba(30, 41, 59, 0.1)',
            'custom-inset': 'inset 0 2px 4px 0 rgba(0, 0, 0, 0.05)',
          }
        }
      }
    }
  </script>

  <style type="text/css">
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #e0f2fe 0%, #dbeafe 50%, #eff6ff 100%);
      background-attachment: fixed;
    }
    
    /* Elegant custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #93c5fd;
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #60a5fa;
    }
    
    @keyframes pulse-slow {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.02); }
    }
    .pulse-effect {
      animation: pulse-slow 3s infinite ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen text-stone-800 flex flex-col antialiased">

  <div id="root" class="flex-grow flex flex-col justify-between"></div>

  <!-- Inline Babel script containing all application logic -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Google Apps Script Web App API 網址
    const API_URL = "https://script.google.com/macros/s/AKfycbzbW1TTicDjAmlriHBNDWw1YqljaM3CP7iMLO-hx-JJYAhw9hcOBv91SZ8Q_FXsvxuDOg/exec";

    // 備份菜單：當後端連線中或失敗時，提供完美的初始使用者體驗
    const FALLBACK_MENU = [
      { name: "黑糖波霸鮮奶茶", price: 65, category: "人氣鮮奶", description: "慢火熬煮手炒黑糖蜜波霸，加入初鹿鮮乳，醇厚誘人" },
      { name: "茉香翡翠蜂綠茶", price: 45, category: "現萃原茶", description: "新鮮茉莉花與鮮翠綠茶共舞，尾韻帶有淡淡高雅龍眼蜜香" },
      { name: "極上大吉嶺紅茶", price: 40, category: "現萃原茶", description: "精選莊園級大吉嶺茶葉，富含成熟果香與熟成麝香葡萄香氣" },
      { name: "四季金萱青茶", price: 40, category: "現萃原茶", description: "自帶天然馥郁奶香，金黃茶湯入喉甘滑溫潤不苦澀" },
      { name: "手作大甲芋泥綠", price: 65, category: "濃純大甲芋", description: "手搗新鮮大甲檳榔心芋，顆粒細緻、芋泥香濃" },
      { name: "芋頭波霸厚奶", price: 70, category: "濃純大甲芋", description: "綿香芋泥、珍Q波霸與厚香奶茶完美的華麗三重絕配" },
      { name: "紅柚滿滿氣泡綠", price: 60, category: "鮮果特調", description: "飽滿多汁手剝紅柚果肉，搭配翡翠綠茶與微微碳酸沁涼" },
      { name: "爆漿青檸百香綠", price: 55, category: "鮮果特調", description: "整粒新鮮百香果融入清香綠，再壓入整顆屏東特產翠綠青檸" },
      { name: "芝芝黑糖可可", price: 75, category: "濃厚厚芝士", description: "香濃法式深黑可可，蓋上厚厚一層純鮮奶打製鹹甜起司奶蓋" },
      { name: "古早冬瓜檸檬青", price: 45, category: "經典古早味", description: "手工慢火冬瓜糖熬煮，混搭黃金青茶與翠綠新鮮檸檬角" }
    ];

    // ==========================================
    // 精美的手繪風與現代簡約 SVG 圖標庫
    // ==========================================
    const Icon = {
      Cup: () => (
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 inline-block" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
          <path strokeLinecap="round" strokeLinejoin="round" d="M17 10h1a4 4 0 014 4v1a4 4 0 01-4 4h-1m0-9V9a4 4 0 00-4-4H5a4 4 0 00-4 4v7a6 6 0 006 6h6a6 6 0 006-6v-1m-4-7h2m-6 3h.01M9 16h.01" />
        </svg>
      ),
      Sparkles: () => (
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 inline-block animate-pulse text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
          <path strokeLinecap="round" strokeLinejoin="round" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
        </svg>
      ),
      User: ({ className = "w-4 h-4" }) => (
        <svg xmlns="http://www.w3.org/2000/svg" class={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
          <path strokeLinecap="round" strokeLinejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
      ),
      Trash: () => (
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 inline-block" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
          <path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
      ),
      Edit: () => (
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 inline-block" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
          <path strokeLinecap="round" strokeLinejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
        </svg>
      ),
      Check: () => (
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 inline-block" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="3">
          <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
        </svg>
      ),
      Refresh: ({ className = "w-5 h-5" }) => (
        <svg xmlns="http://www.w3.org/2000/svg" class={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
          <path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.21 15H9m3 0l-3-3m0 0l3-3m-3 3h12" />
        </svg>
      ),
      Plus: () => (
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5">
          <path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4" />
        </svg>
      ),
      Minus: () => (
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5">
          <path strokeLinecap="round" strokeLinejoin="round" d="M20 12H4" />
        </svg>
      ),
      Coffee: () => (
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-milktea-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
          <path strokeLinecap="round" strokeLinejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
        </svg>
      ),
      Info: ({ className = "w-5 h-5" }) => (
        <svg xmlns="http://www.w3.org/2000/svg" class={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
          <path strokeLinecap="round" strokeLinejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      ),
      Warning: () => (
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
          <path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
      ),
      Bag: ({ className = "w-5 h-5" }) => (
        <svg xmlns="http://www.w3.org/2000/svg" class={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
          <path strokeLinecap="round" strokeLinejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
        </svg>
      ),
      Download: ({ className = "w-4 h-4 inline-block" }) => (
        <svg xmlns="http://www.w3.org/2000/svg" class={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
          <path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
        </svg>
      )
    };

    // ==========================================
    // OrderForm 元件：精美的填單與修改表單
    // ==========================================
    function OrderForm({ menu, onSubmit, editOrder, onCancelEdit, isSubmitting }) {
      const [name, setName] = useState(() => localStorage.getItem("drink_username") || "");
      const [selectedDrinkName, setSelectedDrinkName] = useState("");
      const [sugar, setSugar] = useState("半糖");
      const [ice, setIce] = useState("少冰");
      const [quantity, setQuantity] = useState(1);

      const SUGAR_OPTIONS = ["正常糖", "七分糖", "半糖", "微糖", "無糖"];
      const ICE_OPTIONS = ["正常冰", "少冰", "微冰", "去冰", "溫熱"];

      // 當切換到編輯模式時，自動帶入該筆訂單數據
      useEffect(() => {
        if (editOrder) {
          setName(editOrder.name);
          setSelectedDrinkName(editOrder.drink);
          setSugar(editOrder.sugar || "半糖");
          setIce(editOrder.ice || "少冰");
          setQuantity(editOrder.quantity || 1);
        } else {
          // 恢復為預設
          setSelectedDrinkName(menu[0]?.name || "");
          setSugar("半糖");
          setIce("少冰");
          setQuantity(1);
        }
      }, [editOrder, menu]);

      // 當選取飲料變更，或數量變更時，自動即時計算單杯與總價
      const activeDrink = useMemo(() => {
        return menu.find(item => item.name === selectedDrinkName) || null;
      }, [selectedDrinkName, menu]);

      const totalPrice = useMemo(() => {
        if (!activeDrink) return 0;
        return activeDrink.price * quantity;
      }, [activeDrink, quantity]);

      // 儲存名字到 localStorage，確保下次自動填寫
      const handleNameChange = (e) => {
        const val = e.target.value;
        setName(val);
        localStorage.setItem("drink_username", val);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name.trim()) {
          alert("請填寫訂購人姓名喔！");
          return;
        }
        if (!selectedDrinkName) {
          alert("請選擇想喝的飲料！");
          return;
        }

        const formData = {
          name: name.trim(),
          drink: selectedDrinkName,
          sugar,
          ice,
          quantity: parseInt(quantity) || 1,
          totalPrice
        };

        if (editOrder) {
          formData.orderId = editOrder.orderId;
        }

        onSubmit(formData);
      };

      return (
        <div id="order-form-container" class="bg-white/50 backdrop-blur-md border border-white/40 rounded-[28px] shadow-[0_10px_40px_rgba(0,0,0,0.04)] p-6 md:p-8 flex flex-col justify-between transition-all duration-300">
          <div>
            {/* 表單抬頭 */}
            <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-950/10">
              <div class="flex items-center gap-2.5">
                <i class="inline-block w-2.5 h-6 bg-blue-600 rounded-[4px] mr-1"></i>
                <div>
                  <h3 class="font-bold text-slate-900 text-lg">
                    {editOrder ? "修改今日訂單" : "我要點餐 Order Form"}
                  </h3>
                  <p class="text-xs text-slate-500 mt-0.5">
                    {editOrder ? `正在編輯 ${editOrder.name} 的飲料項目` : "選擇喜愛的冰熱度與甜度"}
                  </p>
                </div>
              </div>
              
              {editOrder && (
                <button
                  type="button"
                  onClick={onCancelEdit}
                  class="text-xs font-semibold px-2.5 py-1 text-slate-500 hover:text-slate-755 bg-slate-100 hover:bg-slate-200 rounded-md transition-all"
                >
                  取消修改
                </button>
              )}
            </div>

            <form onSubmit={handleSubmit} class="space-y-5">
              {/* 訂購人姓名 */}
              <div>
                <label class="block text-[13px] font-semibold text-slate-600 mb-2 flex items-center gap-1.5">
                  <Icon.User className="w-4 h-4 text-blue-500" />
                  訂購人姓名
                </label>
                <input
                  type="text"
                  placeholder="請輸入您的姓名 (例如王小明)"
                  value={name}
                  onChange={handleNameChange}
                  required
                  class="w-full px-4 py-2.5 rounded-xl border border-slate-950/10 focus:outline-none focus:ring-2 focus:ring-blue-500/20 bg-white/80 hover:bg-white transition-all font-medium text-slate-800 placeholder-slate-400 text-sm"
                />
              </div>

              {/* 選擇飲料 */}
              <div>
                <label class="block text-[13px] font-semibold text-slate-600 mb-2 flex items-center gap-1.5">
                  <i class="inline-block text-blue-500">🥤</i>
                  選擇飲料品項
                </label>
                <div class="relative">
                  <select
                    value={selectedDrinkName}
                    onChange={(e) => setSelectedDrinkName(e.target.value)}
                    required
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-950/10 focus:outline-none focus:ring-2 focus:ring-blue-500/20 bg-white/80 hover:bg-white transition-all font-semibold text-slate-800 text-sm appearance-none cursor-pointer"
                  >
                    <option value="" disabled>-- 請選擇一杯飲品 --</option>
                    {menu.map(drink => (
                      <option key={drink.name} value={drink.name}>
                        {drink.name} (NT$ {drink.price})
                      </option>
                    ))}
                  </select>
                  <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-500">
                    <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                      <path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/>
                    </svg>
                  </div>
                </div>
                
                {activeDrink && (
                  <div class="mt-2.5 p-3 rounded-xl bg-white/70 border border-slate-100 text-xs text-slate-600 space-y-1 shadow-sm">
                    <div class="flex justify-between font-semibold text-slate-800">
                      <span>類別: {activeDrink.category || "精選"}</span>
                      <span class="text-blue-600">單價: NT$ {activeDrink.price} / 杯</span>
                    </div>
                    {activeDrink.description && (
                      <p class="text-slate-500 leading-relaxed italic">「{activeDrink.description}」</p>
                    )}
                  </div>
                )}
              </div>

              {/* 甜度篩選按鈕 */}
              <div>
                <label class="block text-[13px] font-semibold text-slate-600 mb-2">甜度選擇</label>
                <div class="grid grid-cols-5 gap-1.5">
                  {SUGAR_OPTIONS.map(opt => (
                    <button
                      key={opt}
                      type="button"
                      onClick={() => setSugar(opt)}
                      class={`py-2 text-xs font-semibold rounded-lg border transition-all duration-200 ${
                        sugar === opt
                          ? "bg-blue-600 text-white border-blue-600 shadow-sm"
                          : "bg-white/80 text-slate-600 border-slate-950/5 hover:bg-white"
                      }`}
                    >
                      {opt}
                    </button>
                  ))}
                </div>
              </div>

              {/* 冰塊篩選按鈕 */}
              <div>
                <label class="block text-[13px] font-semibold text-slate-600 mb-2">冰塊選擇</label>
                <div class="grid grid-cols-5 gap-1.5">
                  {ICE_OPTIONS.map(opt => (
                    <button
                      key={opt}
                      type="button"
                      onClick={() => setIce(opt)}
                      class={`py-2 text-xs font-semibold rounded-lg border transition-all duration-200 ${
                        ice === opt
                          ? "bg-blue-600 text-white border-blue-600 shadow-sm"
                          : "bg-white/80 text-slate-600 border-slate-950/5 hover:bg-white"
                      }`}
                    >
                      {opt}
                    </button>
                  ))}
                </div>
              </div>

              {/* 數量調整加減鈕 */}
              <div class="flex items-center justify-between bg-white/70 p-4 rounded-xl border border-slate-950/5">
                <div>
                  <span class="block text-sm font-bold text-slate-800">數量</span>
                  <span class="text-xs text-slate-400">目前點選數量</span>
                </div>
                <div class="flex items-center gap-3">
                  <button
                    type="button"
                    onClick={() => setQuantity(q => Math.max(1, q - 1))}
                    disabled={quantity <= 1}
                    class="w-10 h-10 flex items-center justify-center rounded-lg bg-white border border-slate-200 hover:bg-slate-50 disabled:opacity-40 disabled:hover:bg-white text-slate-600 transition-all font-bold"
                  >
                    <Icon.Minus />
                  </button>
                  <span class="w-8 text-center text-lg font-bold text-slate-800 font-mono">
                    {quantity}
                  </span>
                  <button
                    type="button"
                    onClick={() => setQuantity(q => q + 1)}
                    class="w-10 h-10 flex items-center justify-center rounded-lg bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 transition-all font-bold"
                  >
                    <Icon.Plus />
                  </button>
                </div>
              </div>
            </form>
          </div>

          {/* 總結算與送出 */}
          <div class="mt-8 pt-6 border-t border-slate-950/10 space-y-4">
            <div class="flex items-baseline justify-between">
              <span class="text-sm font-medium text-slate-500">預估結算金額</span>
              <div class="text-right">
                <span class="text-xs text-slate-400 mr-1 font-mono">NT$ {activeDrink?.price || 0} × {quantity} =</span>
                <span class="text-2xl font-black text-blue-700 font-mono">
                  NT$ {totalPrice}
                </span>
              </div>
            </div>

            <button
              onClick={handleSubmit}
              disabled={isSubmitting || !name || !selectedDrinkName}
              class={`w-full py-4 px-6 rounded-2xl font-bold text-white shadow-md transition-all duration-300 flex items-center justify-center gap-2 ${
                isSubmitting
                  ? "bg-slate-400 cursor-not-allowed"
                  : "bg-gradient-to-r from-blue-600 to-blue-500 hover:opacity-95 shadow-[0_8px_20px_rgba(37,99,235,0.2)] active:scale-98 cursor-pointer"
              }`}
            >
              {isSubmitting ? (
                <>
                  <Icon.Refresh className="w-5 h-5 animate-spin" />
                  <span>傳送至雲端試算表...</span>
                </>
              ) : (
                <>
                  <Icon.Check />
                  <span>{editOrder ? "送出修改 ($" + totalPrice + ")" : "送出訂單 ($" + totalPrice + ")"}</span>
                </>
              )}
            </button>
          </div>
        </div>
      );
    }

    // ==========================================
    // OrderList 元件：精美的當日訂單列表
    // ==========================================
    function OrderList({ orders, menu, onEdit, onDelete, onRefresh, isLoading }) {
      const [searchTerm, setSearchTerm] = useState("");
      
      // 計算今日訂單全局統計
      const stats = useMemo(() => {
        let totalCups = 0;
        let totalPrice = 0;
        const drinkBreakdown = {};

        orders.forEach(ord => {
          totalCups += ord.quantity;
          totalPrice += ord.totalPrice;
          drinkBreakdown[ord.drink] = (drinkBreakdown[ord.drink] || 0) + ord.quantity;
        });

        return { totalCups, totalPrice, drinkBreakdown };
      }, [orders]);

      // 下載今日訂單 CSV 功能
      const handleDownloadCSV = () => {
        if (orders.length === 0) {
          alert("目前還沒有任何訂單可以下載唷！");
          return;
        }

        // 定義表頭
        const headers = ["訂購人", "品項", "甜度", "冰塊", "數量(杯)", "一單金額(元)"];
        const rows = orders.map(ord => [
          ord.name,
          ord.drink,
          ord.sugar,
          ord.ice,
          ord.quantity,
          ord.totalPrice
        ]);

        // 加上統計摘要
        const summaryRows = [
          [],
          ["📊 【今日訂購統計彙總】"],
          ["總品項數", orders.length, "筆"],
          ["統計總杯數", stats.totalCups, "杯"],
          ["合計應付總額", stats.totalPrice, "元"],
          [],
          ["🥤 【品項合計統計】"],
          ["飲料名稱", "點單數量"],
          ...Object.entries(stats.drinkBreakdown).map(([drink, cups]) => [drink, `${cups} 杯`])
        ];

        // 拼接成 UTF-8 與 BOM 頭防中文亂碼
        const csvContent = "\uFEFF" + [headers, ...rows, ...summaryRows]
          .map(e => e.map(val => `"${String(val).replace(/"/g, '""')}"`).join(","))
          .join("\n");

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");

        const todayStr = new Date().toISOString().split('T')[0];
        link.setAttribute("href", url);
        link.setAttribute("download", `${todayStr}_辦公室飲料訂單明細與彙總表.csv`);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // 搜尋關鍵字過濾
      const filteredOrders = useMemo(() => {
        if (!searchTerm.trim()) return orders;
        const q = searchTerm.toLowerCase();
        return orders.filter(ord => 
          ord.name.toLowerCase().includes(q) || 
          ord.drink.toLowerCase().includes(q) ||
          ord.sugar.toLowerCase().includes(q) ||
          ord.ice.toLowerCase().includes(q)
        );
      }, [orders, searchTerm]);

      return (
        <div class="space-y-6">
          {/* 本日亮點統計板 (Bento Style Stats) */}
          <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
            <div class="bg-white/50 backdrop-blur-md border border-white/40 rounded-2xl p-4 shadow-custom flex items-center gap-3.5">
              <div class="p-3 bg-blue-50 text-blue-600 rounded-xl">
                <Icon.Bag className="w-6 h-6" />
              </div>
              <div>
                <span class="block text-xs font-semibold text-slate-400">當日訂購杯數</span>
                <span class="text-2xl font-black text-slate-800 font-mono">{stats.totalCups} <span class="text-xs font-semibold text-slate-500">杯</span></span>
              </div>
            </div>

            <div class="bg-white/50 backdrop-blur-md border border-white/40 rounded-2xl p-4 shadow-custom flex items-center gap-3.5">
              <div class="p-3 bg-emerald-50 text-emerald-600 rounded-xl">
                <span class="text-xl font-bold">💰</span>
              </div>
              <div>
                <span class="block text-xs font-semibold text-slate-400">今日總計</span>
                <span class="text-2xl font-black text-emerald-700 font-mono">NT$ {stats.totalPrice}</span>
              </div>
            </div>

            <div class="col-span-2 md:col-span-1 bg-gradient-to-br from-blue-600 to-blue-700 rounded-2xl p-4 text-white shadow-custom flex flex-col justify-between">
              <div class="flex justify-between items-center">
                <span class="text-xs font-semibold opacity-90">實時狀態</span>
                <span class="flex h-2 w-2 relative">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                </span>
              </div>
              <div class="flex justify-between items-end mt-1.5">
                <div>
                  <span class="block text-[10px] opacity-75 leading-none">工作表狀態</span>
                  <span class="text-sm font-bold opacity-100">與 GAS 連線中</span>
                </div>
                <button 
                  onClick={onRefresh} 
                  disabled={isLoading}
                  class="p-1 px-2.5 bg-white/20 hover:bg-white/30 rounded-lg text-xs font-semibold flex items-center gap-1 transition-all cursor-pointer"
                >
                  <Icon.Refresh className={`w-3.5 h-3.5 ${isLoading ? 'animate-spin' : ''}`} />
                  更新
                </button>
              </div>
            </div>
          </div>

          {/* 訂單明細大面板 */}
          <div class="bg-white/50 backdrop-blur-md border border-white/40 rounded-[28px] shadow-[0_10px_40px_rgba(0,0,0,0.04)] p-6 md:p-8 space-y-5">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div class="flex items-center gap-2.5">
                <i class="inline-block w-2.5 h-6 bg-blue-600 rounded-[4px] mr-1"></i>
                <div>
                  <h3 class="font-bold text-slate-900 text-lg">
                    今日清單 Order List
                  </h3>
                  <p class="text-xs text-slate-400 mt-0.5">點選右側可以用訂購人或茶飲搜尋快濾唷</p>
                </div>
              </div>

              {/* 搜尋欄位與下載按鈕 */}
              <div class="flex items-center gap-2 max-w-md w-full sm:w-auto">
                <div class="relative flex-grow">
                  <input
                    type="text"
                    placeholder="搜尋名字或品項..."
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    class="w-full pl-9 pr-4 py-2 border border-slate-900/10 focus:outline-none focus:ring-2 focus:ring-blue-500/20 bg-white/80 hover:bg-white rounded-xl text-xs font-semibold font-medium text-slate-700 placeholder-slate-400 transition-all font-sans"
                  />
                  <span class="absolute left-3 top-2.5 text-slate-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                  </span>
                </div>

                <button
                  onClick={handleDownloadCSV}
                  disabled={orders.length === 0}
                  class="flex items-center gap-1.5 px-3 py-2 bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 text-white text-xs font-bold rounded-xl shadow-sm transition-all cursor-pointer disabled:cursor-not-allowed whitespace-nowrap active:scale-95"
                  title="下載 CSV 訂單清單與統計表"
                >
                  <Icon.Download />
                  <span>下載明細</span>
                </button>
              </div>
            </div>

            {/* 一目了然的點單統計摘要 (買家打電話訂購專用) */}
            {stats.totalCups > 0 && (
              <div class="p-4 rounded-xl bg-white/70 border border-slate-200/60 mr-1 text-xs shadow-sm">
                <span class="block font-bold text-slate-800 mb-2">📊 點單快速統計 (致電飲料店神隊友)</span>
                <div class="flex flex-wrap gap-2">
                  {Object.entries(stats.drinkBreakdown).map(([drink, cups]) => (
                    <span key={drink} class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg bg-white border border-slate-200/65 font-semibold text-slate-700 font-mono shadow-[0_2px_8px_rgba(0,0,0,0.02)]">
                      🥤 {drink} <strong class="text-blue-600 font-bold ml-1">{cups} 杯</strong>
                    </span>
                  ))}
                </div>
              </div>
            )}

            {/* 訂單卡片列表 */}
            {filteredOrders.length === 0 ? (
              <div class="flex flex-col items-center justify-center py-14 px-6 border border-dashed border-slate-300 rounded-[20px] bg-white/30 backdrop-blur">
                <div class="pulse-effect bg-blue-50 p-4.5 rounded-full mb-4 text-blue-500">
                  <Icon.Coffee />
                </div>
                {orders.length === 0 ? (
                  <>
                    <h4 class="font-bold text-slate-700 text-base mb-1">今日尚未有任何人點單</h4>
                    <p class="text-xs text-slate-400 text-center max-w-sm leading-relaxed">
                      快在旁邊填上自己的大名 and 想喝的飲料，成為今天辦公室第一個揪團喝飲料的明星吧！☕
                    </p>
                  </>
                ) : (
                  <>
                    <h4 class="font-bold text-slate-700 text-base mb-1">找不到符合的點單內容</h4>
                    <p class="text-xs text-slate-400 text-center max-w-xs leading-relaxed">
                      請更換您的關鍵字（例如檢查是否有輸入拼音錯誤或錯字唷）
                    </p>
                  </>
                )}
              </div>
            ) : (
              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-1 xl:grid-cols-2 gap-4 max-h-[580px] overflow-y-auto pr-1">
                {filteredOrders.map((ord, idx) => {
                  return (
                    <div
                      key={ord.orderId || idx}
                      class="bg-white/60 hover:bg-white/85 border border-white/50 rounded-2xl p-4 shadow-custom-sm hover:shadow-custom hover:border-blue-200 transition-all duration-300 flex flex-col justify-between gap-3 group"
                    >
                      <div class="flex justify-between items-start gap-2">
                        <div class="space-y-1">
                          {/* 訂購人姓名 & 訂單 ID 標記 */}
                          <div class="flex items-center gap-1.5 flex-wrap">
                            <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-md bg-white border border-slate-200 text-slate-800 text-xs font-bold font-semibold">
                              <Icon.User className="w-3 h-3 text-slate-600" />
                              {ord.name}
                            </span>
                            <span class="text-[9px] text-slate-400 font-mono">
                              {ord.orderId ? `#${ord.orderId.slice(0, 5)}` : `#${idx+1}`}
                            </span>
                          </div>

                          {/* 飲料名稱 */}
                          <h4 class="text-slate-900 font-bold text-base mt-2 group-hover:text-blue-600 transition-colors">
                            {ord.drink}
                          </h4>
                          
                          {/* 冰塊、甜度與杯數標籤 */}
                          <div class="flex items-center gap-1.5 flex-wrap pt-1">
                            <span class="px-2 py-0.5 rounded text-[11px] font-bold bg-amber-50 text-amber-705 border border-amber-100/60">
                              🍬 {ord.sugar}
                            </span>
                            <span class="px-2 py-0.5 rounded text-[11px] font-bold bg-sky-55 text-sky-700 border border-sky-100/60">
                              ❄️ {ord.ice}
                            </span>
                            <span class="px-2 py-0.5 rounded text-[11px] font-mono font-bold bg-white text-slate-600 border border-slate-200">
                              共 {ord.quantity} 杯
                            </span>
                          </div>
                        </div>

                        {/* 單項金額 */}
                        <div class="text-right">
                          <span class="block text-lg font-black text-blue-600 font-mono">
                            NT$ {ord.totalPrice}
                          </span>
                          <span class="text-[10px] text-slate-400 font-medium">NT$ {parseInt(ord.totalPrice/ord.quantity)} / 杯</span>
                        </div>
                      </div>

                      {/* 動作按鈕：修改、刪除 */}
                      <div class="flex justify-end gap-2 border-t border-slate-950/5 pt-3 mt-1 opacity-90 group-hover:opacity-100 transition-opacity">
                        <button
                          onClick={() => onEdit(ord)}
                          class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white border border-slate-200 hover:bg-blue-50 text-slate-600 hover:text-blue-700 text-xs font-semibold shadow-sm transition-all cursor-pointer"
                        >
                          <Icon.Edit />
                          <span>修改項</span>
                        </button>
                        <button
                          onClick={() => onDelete(ord.orderId)}
                          class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white border border-slate-200 hover:bg-rose-50 text-slate-600 hover:text-rose-600 text-xs font-semibold shadow-sm transition-all cursor-pointer"
                        >
                          <Icon.Trash />
                          <span>刪除</span>
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // App：頂級整合與狀態管理中心
    // ==========================================
    function App() {
      const [menu, setMenu] = useState(FALLBACK_MENU);
      const [orders, setOrders] = useState([]);
      const [currentEditOrder, setCurrentEditOrder] = useState(null);
      const [isLoading, setIsLoading] = useState(false);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [errorMessage, setErrorMessage] = useState("");
      const [showIntro, setShowIntro] = useState(true);

      // 載入資料 (GET)
      const fetchDatabase = async () => {
        setIsLoading(true);
        setErrorMessage("");
        try {
          const res = await fetch(API_URL);
          if (!res.ok) {
            throw new Error(`雲端試算表響應錯誤狀態：${res.status}`);
          }
          const data = await res.json();
          
          // 後端回傳 menu 與 orders
          if (data.menu && data.menu.length > 0) {
            setMenu(data.menu);
          } else {
            console.log("GAS 菜單為空，使用精美備份菜單");
            setMenu(FALLBACK_MENU);
          }

          if (data.orders) {
            setOrders(data.orders);
          } else {
            setOrders([]);
          }
        } catch (err) {
          console.error("載入失敗：", err);
          setErrorMessage("雲端載入失敗！系統已替您自動載入「本日精選備選菜單」。");
          // 失敗時保持 fallback menu，至少可讓前端維持可用狀態
          setMenu(FALLBACK_MENU);
        } finally {
          setIsLoading(false);
        }
      };

      // 載入時觸發一次
      useEffect(() => {
        fetchDatabase();
      }, []);

      // 快速一鍵將選單大卡片的飲料注入表單
      const handleSelectFromMenu = (drink) => {
        // 設定當前選取的編輯狀態或新狀態
        // 為了將此資訊流向 OrderForm 元件，我們將這視為「新填單」，直接滾動定位並填入
        const formTarget = document.getElementById("order-form-container");
        if (formTarget) {
          formTarget.scrollIntoView({ behavior: 'smooth' });
        }
        
        // 我們直接模擬更新 editOrder
        setCurrentEditOrder({
          name: localStorage.getItem("drink_username") || "",
          drink: drink.name,
          sugar: "半糖",
          ice: "少冰",
          quantity: 1,
          totalPrice: drink.price
        });
      };

      // 提交訂單 (新增或修改) - POST
      const handleFormSubmit = async (formData) => {
        setIsSubmitting(true);
        setErrorMessage("");
        
        const isUpdate = !!formData.orderId;
        const payload = {
          action: isUpdate ? "update" : "create",
          data: formData
        };

        try {
          // 為避免 CORS options 預檢擋住，與 GAS 通訊時使用 plain POST payload 策略 
          const response = await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
          });

          // 部分 CORS 機制會跟隨 302 跳轉但由於跨網域造成不允許讀取 body
          // 我們在此做雙重容錯：如果 status 成功，或是 type 是 opaque
          if (!response.ok && response.status !== 0) {
            throw new Error(`雲端工作表回應拒絕: ${response.status}`);
          }

          // 清除修改模式
          setCurrentEditOrder(null);
          
          // 即時從雲端重新拉取最新列表，保證完全一致性
          await fetchDatabase();
          
          // 滾動回到清單
          const listTarget = document.getElementById("orders-hub");
          if (listTarget) {
            listTarget.scrollIntoView({ behavior: 'smooth' });
          }
        } catch (err) {
          console.error("提交失敗：", err);
          setErrorMessage("訂單傳送時發生未知網路中斷。請重新再試一次！");
        } finally {
          setIsSubmitting(false);
        }
      };

      // 處理刪除 - POST
      const handleDelete = async (orderId) => {
        if (!window.confirm("你確定要刪除這筆飲料訂單嗎？😢")) {
          return;
        }

        setIsLoading(true);
        setErrorMessage("");

        const payload = {
          action: "delete",
          data: { orderId }
        };

        try {
          const response = await fetch(API_URL, {
            method: "POST",
            body: JSON.stringify(payload)
          });

          if (!response.ok && response.status !== 0) {
            throw new Error("GAS 刪除失敗");
          }

          // 重新整理
          await fetchDatabase();
        } catch (err) {
          console.error("刪除失敗：", err);
          setErrorMessage("刪除失敗！可能由於跨網域載入延遲，建議點擊「實時更新」重試！");
        } finally {
          setIsLoading(false);
        }
      };

      // 依類別將菜單分組分頁顯示
      const categorizedMenu = useMemo(() => {
        const groups = {};
        menu.forEach(item => {
          const cat = item.category || "精選調飲";
          if (!groups[cat]) groups[cat] = [];
          groups[cat].push(item);
        });
        return groups;
      }, [menu]);

      return (
        <div class="max-w-7xl mx-auto w-full px-4 sm:px-6 py-6 md:py-10 space-y-6 flex-grow flex flex-col">
          
          {/* Header 智慧標題列 */}
          <header class="bg-white/40 backdrop-blur-md border border-white/30 rounded-3xl p-6 md:px-8 md:py-7 flex flex-col sm:flex-row sm:items-center justify-between gap-6 relative overflow-hidden transition-all shadow-[0_4px_15px_rgba(0,0,0,0.05)]">
            {/* Background absolute coffee pattern decors */}
            <div class="absolute right-0 bottom-[-50px] opacity-5 pointer-events-none select-none">
              <svg class="w-72 h-72 fill-current text-blue-500" viewBox="0 0 24 24">
                <path d="M2 21h18v-2H2v2zM20 8h-2V5h2v3zm2-3c0-1.1-.9-2-2-2h-4v7h4c1.1 0 2-.9 2-2V5zm-4 7H4v5h14v-5z" />
              </svg>
            </div>

            <div class="space-y-2 relative z-10">
              <div class="flex items-center gap-3">
                <span class="text-3xl animate-bounce">🧋</span>
                <h1 class="text-2xl md:text-3xl font-black tracking-tight font-sans bg-gradient-to-r from-blue-700 to-emerald-600 bg-clip-text text-transparent">
                  辦公室下午茶：飲料集單系統
                </h1>
              </div>
              <p class="text-xs md:text-sm text-slate-500 font-medium">
                🥤 今日揪團特調試算表！今日日期已自動定位，資料由 Google Apps Script 後端即時同步。
              </p>
            </div>

            <div class="flex items-center gap-3 relative z-10 flex-wrap sm:flex-nowrap">
              {/* 更新按鈕 */}
              <button
                onClick={fetchDatabase}
                disabled={isLoading}
                class="flex items-center gap-1.5 px-4.5 py-2.5 rounded-xl bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 hover:text-slate-900 active:scale-95 text-xs font-bold font-semibold transition-all cursor-pointer disabled:opacity-50 shadow-sm"
              >
                <Icon.Refresh className={`w-4 h-4 ${isLoading ? 'animate-spin' : ''}`} />
                <span>{isLoading ? "同步中..." : "重新整理數據"}</span>
              </button>
              
              {/* 手動提示今日日期 */}
              <div class="px-4 py-2 bg-blue-55/40 backdrop-blur border border-blue-100 rounded-xl text-center">
                <span class="block text-[9px] text-blue-500 font-bold uppercase tracking-wider font-mono">Today Session</span>
                <span class="text-xs font-mono font-bold text-blue-700 tracking-wide">
                  {new Date().toISOString().split('T')[0]}
                </span>
              </div>
            </div>
          </header>

          {/* 錯誤/通知橫幅 */}
          {errorMessage && (
            <div class="bg-amber-50 border-l-4 border-amber-500 text-slate-705 p-4 rounded-xl shadow-custom-sm flex items-start gap-3 transition-all duration-300">
              <Icon.Warning />
              <div class="flex-grow">
                <p class="font-bold text-sm text-amber-800">系統小警示</p>
                <p class="text-xs text-amber-950 mt-0.5">{errorMessage}</p>
              </div>
              <button 
                onClick={() => setErrorMessage("")}
                class="text-amber-500 hover:text-amber-800 text-xs font-bold px-1 cursor-pointer"
              >
                我知道了
              </button>
            </div>
          )}

          {/* 介紹說明卡 & 快捷選單推薦 */}
          {showIntro && (
            <div class="bg-white/40 backdrop-blur-md border border-white/30 rounded-3xl p-5 md:p-6 shadow-custom-sm relative overflow-hidden">
              <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                <div class="flex items-start gap-3">
                  <span class="text-2xl mt-0.5">💡</span>
                  <div>
                    <h4 class="font-bold text-slate-800 text-sm">💡 揪團小撇步：點擊下方菜單，自動幫你填寫訂票！</h4>
                    <p class="text-xs text-slate-500 mt-1 leading-relaxed">
                      不需手動慢慢輸入飲料名稱，直接在下方<b>「今日飲料菜單」</b>點擊您中意的項目，系統便會快速帶入左側的訂票區域。訂購人、甜度、冰塊設定好後呼叫試算表就完成囉！
                    </p>
                  </div>
                </div>
                <button 
                  onClick={() => setShowIntro(false)}
                  class="text-xs text-blue-600 hover:text-blue-800 font-semibold underline self-end sm:self-center cursor-pointer"
                >
                  隱藏這項提示 ×
                </button>
              </div>
            </div>
          )}

          {/* 主版面佈局：左表單，右清單 (2 Column Grid) */}
          <main class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start flex-grow">
            
            {/* 左側：OrderForm 填單區 (佔 5格) */}
            <div class="lg:col-span-5 space-y-6">
              <OrderForm
                menu={menu}
                onSubmit={handleFormSubmit}
                editOrder={currentEditOrder}
                onCancelEdit={() => setCurrentEditOrder(null)}
                isSubmitting={isSubmitting}
              />

              {/* 即時載入小動畫 */}
              {isLoading && (
                <div class="flex items-center justify-center p-4 bg-white/50 backdrop-blur rounded-xl border border-slate-950/10 gap-2.5">
                  <Icon.Refresh className="w-5 h-5 text-blue-600 animate-spin" />
                  <span class="text-xs font-bold text-slate-600">正在取得今日最新訂單資訊...</span>
                </div>
              )}
            </div>

            {/* 右側：分類菜單點選 & 今日訂單回饋 (佔 7格) */}
            <div class="lg:col-span-7 space-y-6">
              
              {/* 可點選之精美即時菜單 */}
              <div class="bg-white/50 backdrop-blur-md border border-white/40 rounded-[28px] shadow-[0_10px_40px_rgba(0,0,0,0.04)] p-6 md:p-8">
                <div class="flex items-center gap-2.5 mb-4 mb-4">
                  <i class="inline-block w-2.5 h-6 bg-blue-600 rounded-[4px] mr-1"></i>
                  <h3 class="font-bold text-slate-900 text-lg flex items-center gap-1">
                    📖 今日手選飲料菜單 <span class="text-xs font-normal text-slate-400 font-sans">(點擊直接填單)</span>
                  </h3>
                </div>
                
                {/* 滾動類別 */}
                <div class="space-y-4 max-h-[290px] overflow-y-auto pr-1">
                  {Object.entries(categorizedMenu).map(([category, items]) => (
                    <div key={category} class="space-y-2">
                      <span class="inline-block text-[11px] font-black tracking-wider text-blue-600 bg-blue-50 border border-blue-100 px-2 py-0.5 rounded-md font-sans">
                        {category}
                      </span>
                      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        {items.map(drink => (
                          <div
                            key={drink.name}
                            onClick={() => handleSelectFromMenu(drink)}
                            class="p-2.5 bg-white/70 hover:bg-white border border-slate-950/5 hover:border-blue-300 rounded-xl cursor-pointer transition-all duration-200 flex items-center justify-between text-left group"
                          >
                            <div class="truncate max-w-[70%]">
                              <span class="block text-xs font-bold text-slate-800 truncate group-hover:text-blue-600 transition-colors">
                                {drink.name}
                              </span>
                              <span class="text-[10px] text-slate-400 block truncate leading-tight mt-0.5">
                                {drink.description || "經典推薦招牌"}
                              </span>
                            </div>
                            <span class="text-xs font-bold text-blue-600 bg-white border border-slate-200 px-2.5 py-1 rounded-lg shadow-sm font-mono">
                              ${drink.price}
                            </span>
                          </div>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {/* 今日訂單詳細清單 */}
              <div id="orders-hub">
                <OrderList
                  orders={orders}
                  menu={menu}
                  onEdit={(ord) => {
                    setCurrentEditOrder(ord);
                    const formTarget = document.getElementById("order-form-container");
                    if (formTarget) {
                      formTarget.scrollIntoView({ behavior: 'smooth' });
                    }
                  }}
                  onDelete={handleDelete}
                  onRefresh={fetchDatabase}
                  isLoading={isLoading}
                />
              </div>

            </div>

          </main>

        </div>
      );
    }

    // 啟動與掛載 React 18 應用程式
    const container = document.getElementById("root");
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
